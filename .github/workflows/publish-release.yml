name: publish-release

# One-off: PATCHes a release's draft flag to false with this job's own GITHUB_TOKEN, publishing
# it. Delete this workflow file once used.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Numeric ID of the release to publish"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}" \
            -F draft=false
