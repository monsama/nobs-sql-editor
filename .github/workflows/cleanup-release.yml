name: cleanup-release

# One-off: deletes a release by id. Used to clear out a release stuck from before build.yml
# stopped drafting releases (a draft with the wrong "untagged-<sha>" tag_name, left behind by
# softprops/action-gh-release's draft-lookup retries). Removed again once it has done its job.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Numeric id of the release to delete"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}"
