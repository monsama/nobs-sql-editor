name: edit-release-notes

# One-off: inserts text into a published release's notes, just before its "**Full Changelog**" line.
# Removed again once it has done its job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to edit, e.g. v1.9.1"
        required: true
      insert:
        description: "Markdown to insert before the Full Changelog line"
        required: true

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Insert the text into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          INSERT: ${{ github.event.inputs.insert }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          gh api "repos/${{ github.repository }}/releases/$ID" --jq .body > body.md
          grep -q '^\*\*Full Changelog\*\*' body.md || { echo "no Full Changelog line in the notes"; exit 1; }
          printf '%s\n\n' "$INSERT" > insert.md
          awk 'FNR==NR { ins = ins $0 "\n"; next } /^\*\*Full Changelog\*\*/ && !done { printf "%s", ins; done=1 } { print }' insert.md body.md > new.md
          gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -F body=@new.md --jq '.html_url'
