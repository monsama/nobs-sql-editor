name: fix-release-body

# One-off: PATCHes a release's body (and optionally its draft flag) with this job's own
# GITHUB_TOKEN. The body is passed as a base64-encoded input to survive YAML/shell quoting.
# Delete this workflow file once used.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Numeric ID of the release to fix"
        required: true
      body_b64:
        description: "New release body, base64-encoded"
        required: true
      publish:
        description: "Also set draft=false"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.event.inputs.body_b64 }}" | base64 -d > /tmp/body.md
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}" \
              -F draft=false --field body=@/tmp/body.md
          else
            gh api -X PATCH "repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}" \
              --field body=@/tmp/body.md
          fi
