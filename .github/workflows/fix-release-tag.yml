name: fix-release-tag

# One-off: PATCHes a release's tag_name with this job's own GITHUB_TOKEN. Used to correct the
# v1.7.0 release that action-gh-release created as "untagged-<sha>" (see the new steps in
# build.yml for why). Delete this workflow file once used.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Numeric ID of the release to fix"
        required: true
      tag_name:
        description: "Correct tag name, e.g. v1.7.0"
        required: true

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ github.event.inputs.release_id }}" \
            -f tag_name="${{ github.event.inputs.tag_name }}"
