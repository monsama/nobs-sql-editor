# Weekly pull requests for outdated dependencies. Minor and patch updates come together, one pull
# request per ecosystem; a major update comes on its own, since it can change behavior. Every pull
# request runs the full test workflow, live and GUI tests included, before it is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # These two go with tauri's webview (wry), not on their own: main.rs hands the WebView2 object
    # wry gives it to webview2-com's interfaces, so all three must use the same windows crate. On
    # their own, windows 0.62 and webview2-com 0.39 failed to compile against wry 0.55 (#101, #102).
    # Patch releases still come. When tauri moves wry to newer ones (Cargo.lock: wry's
    # "windows-core" line), raise both in Cargo.toml by hand, together.
    ignore:
      - dependency-name: windows
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: webview2-com
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]
